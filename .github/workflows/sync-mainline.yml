name: Sync AW1-3 mainline

on:
  push:
    branches: [MM]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward AW1-3/MM from the integrated mainline
        env:
          BASE_SHA: 321f8372727115cf73903bea1686e54432fe86b9
        run: |
          set -euo pipefail
          git fetch https://github.com/Advancedwarroom/aw-1-3.git main
          SOURCE_SHA="$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor "${BASE_SHA}" "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          # Keep this one-time bootstrap workflow unchanged in the push diff.
          cp .github/workflows/sync-mainline.yml /tmp/sync-mainline.yml
          git checkout "${SOURCE_SHA}" -- .
          mkdir -p .github/workflows
          cp /tmp/sync-mainline.yml .github/workflows/sync-mainline.yml

          # The Actions token cannot update workflow files; restore the source workflow
          # through the GitHub Contents API after this code/assets sync completes.
          rm -f .github/workflows/selfplay.yml
          git add -A

          TREE_SHA="$(git write-tree)"
          NEW_SHA="$(printf 'Sync AW1-3 from integrated mainline %s\n' "${SOURCE_SHA}" | \
            GIT_AUTHOR_NAME='Advancedwarroom' GIT_AUTHOR_EMAIL='m18945639887@163.com' \
            GIT_COMMITTER_NAME='Advancedwarroom' GIT_COMMITTER_EMAIL='m18945639887@163.com' \
            git commit-tree "${TREE_SHA}" -p "${SOURCE_SHA}")"
          echo "Pushing synchronized commit ${NEW_SHA}"
          git push origin "${NEW_SHA}:refs/heads/MM" --force-with-lease=refs/heads/MM:"${GITHUB_SHA}"
