name: 打包 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 装 Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 下载 Godot 4.7.1 Mono 无头版
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -o Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          sudo ln -s $PWD/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 /usr/local/bin/godot

      - name: 装导出模板
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip -o Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz -d ~/.local/share/godot/export_templates
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: 装 Android Gradle 构建模板到项目
        run: |
          unzip -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/android_source.zip -d /tmp/asrc
          if [ -f /tmp/asrc/build.gradle ]; then
            mkdir -p android && cp -r /tmp/asrc/. android/
          else
            cp -r /tmp/asrc/android ./android
          fi
          ls android

      - name: 修导出预设（C# 必须 Gradle + linux-bionic）
        run: |
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' export_presets.cfg
          sed -i 's|dotnet/android_use_linux_bionic=false|dotnet/android_use_linux_bionic=true|' export_presets.cfg

      - name: 生成调试签名（自己测够用）
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Debug,O=AW,C=CN"

      - name: 导入资源并导出 APK
        run: |
          godot --headless --import --path . --quit
          mkdir -p build
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/debug.keystore \
          GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey \
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android \
          godot --headless --export-release "Android" build/AWone1.apk

      - name: 上传 APK（去 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: AWone1-android
          path: build/AWone1.apk
